name: Build Android APK

on:
  push:
    branches:
      - arena/01a09795-nageeb-study-os
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
          accept-android-sdk-licenses: true

      - name: Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk NageebStudyOS-v2-debug.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NageebStudyOS-v2-debug-apk
          path: NageebStudyOS-v2-debug.apk
          retention-days: 30

      - name: Publish APK to beta release
        if: github.event_name == 'push' && github.ref == 'refs/heads/arena/01a09795-nageeb-study-os'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0-beta
          name: NAGEEB STUDY OS — V2 تجريبية
          body: |
            نسخة V2 تجريبية (debug) مبنية تلقائيًا من GitHub Actions.

            ## طريقة التثبيت
            1. نزّل ملف `NageebStudyOS-v2-debug.apk` من الـ Assets بالأسفل.
            2. افتح الملف على هاتف أندرويد واسمح بالتثبيت من مصادر غير معروفة عند الطلب.
            3. التطبيق يعمل بالكامل دون إنترنت، باللغة العربية فقط.
          prerelease: true
          files: NageebStudyOS-v2-debug.apk
          fail_on_unmatched_files: true
